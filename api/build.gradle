plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'org.graalvm.buildtools.native' version '0.11.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

repositories {
    mavenCentral()
}

group = 'dev.ngb.base_stack'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

ext {
    set('sentryVersion', "8.27.0")
    set('springAiVersion', "1.1.0")
    set('springModulithVersion', "2.0.0")
}

allprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://repo.spring.io/snapshot' }
    }
}

configure(subprojects.findAll { it.path != ':modules:core' }) {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    dependencyManagement {
        imports {
            mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
            mavenBom "io.sentry:sentry-bom:${sentryVersion}"
            mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
        }
    }

    dependencies {
        implementation project(':modules:core')
        implementation 'org.springframework.boot:spring-boot-starter-aspectj'
        implementation 'org.springframework.boot:spring-boot-websocket'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
//      implementation 'org.springframework.boot:spring-boot-starter-amqp'
        implementation 'org.springframework.boot:spring-boot-starter-logging'
        implementation 'org.springframework.boot:spring-boot-jackson'
        implementation 'org.springframework.boot:spring-boot-batch'
        implementation 'org.springframework.boot:spring-boot-cache'
//      implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
        implementation 'org.springframework.boot:spring-boot-data-jdbc'
        implementation 'org.springframework.boot:spring-boot-data-redis'
        implementation 'org.springframework.boot:spring-boot-graphql'
        implementation 'org.springframework.boot:spring-boot-jdbc'
        implementation 'org.springframework.boot:spring-boot-mail'
        implementation 'org.springframework.boot:spring-boot-security-oauth2-resource-server'
        implementation 'org.springframework.boot:spring-boot-quartz'
        implementation 'org.springframework.boot:spring-boot-security'
        implementation 'org.springframework.boot:spring-boot-validation'
        implementation 'org.springframework.boot:spring-boot-starter-webmvc'
        implementation 'io.sentry:sentry-spring-boot-4'
        implementation 'org.springframework.boot:spring-boot-kafka'
        implementation 'org.springframework.boot:spring-boot-starter-liquibase'
        implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.0'
        implementation 'io.github.resilience4j:resilience4j-all:2.3.0'
//      implementation 'org.springframework.ai:spring-ai-markdown-document-reader'
//      implementation 'org.springframework.ai:spring-ai-pdf-document-reader'
//      implementation 'org.springframework.ai:spring-ai-starter-model-vertex-ai-embedding'
//      implementation 'org.springframework.ai:spring-ai-starter-model-vertex-ai-gemini'
        implementation 'org.springframework.modulith:spring-modulith-events-api'
        implementation 'org.springframework.modulith:spring-modulith-core'
        implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
//        implementation 'org.springframework.security:spring-security-messaging'
        implementation 'org.springframework.boot:spring-boot-micrometer-observation'
        implementation 'org.redisson:redisson:3.52.0'
        compileOnly 'org.projectlombok:lombok'
        developmentOnly 'org.springframework.boot:spring-boot-devtools'
        runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
        runtimeOnly 'org.postgresql:postgresql'
        runtimeOnly 'org.springframework.modulith:spring-modulith-actuator'
        runtimeOnly 'org.springframework.modulith:spring-modulith-observability'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.0'
//      testImplementation 'org.springframework.amqp:spring-rabbit-test'
        testImplementation 'org.springframework.batch:spring-batch-test'
        testImplementation 'org.springframework.graphql:spring-graphql-test'
        testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
        testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
        testImplementation 'org.springframework.security:spring-security-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-scalar:2.8.13'

        implementation 'com.github.f4b6a3:uuid-creator:6.1.0'
        implementation 'com.apollographql.federation:federation-graphql-java-support:5.4.0'
        implementation 'com.github.ben-manes.caffeine:caffeine:3.2.3'
        implementation 'net.logstash.logback:logstash-logback-encoder:9.0'
    }

    test {
        useJUnitPlatform()
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}