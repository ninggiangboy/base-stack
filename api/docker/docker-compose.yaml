  #
  # ======================
  # Postgres
  # ======================
  postgres:
    image: postgres:18.0
    container_name: base_stack_postgres
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    command: postgres -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
    ports:
      - "5432:5432"
    networks:
      - base_stack_net

  # ======================
  # RabbitMQ
  # ======================
  #  rabbitmq:
  #    image: rabbitmq:4.2.0
  #    container_name: base_stack_rabbitmq
  #    environment:
  #      RABBITMQ_DEFAULT_USER: myuser
  #      RABBITMQ_DEFAULT_PASS: secret
  #    ports:
  #      - "5672:5672"
  #    networks:
  #      - base_stack_net

  # ======================
  # Valkey
  # ======================
  valkey:
    image: valkey/valkey:9.0.0
    container_name: base_stack_valkey
    ports:
      - "6379:6379"
    networks:
      - base_stack_net

  # ======================
  # Kafka & Kafka UI
  # ======================
  kafka:
    image: apache/kafka:4.1.1
    container_name: base_stack_kafka
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9094:9094"
      - "9095:9095"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_LISTENERS: "BROKER://:9092,CONTROLLER://:9093,INTERNAL://:9094,EXTERNAL://:9095"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "BROKER"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_ADVERTISED_LISTENERS: >
        BROKER://kafka:9092,
        INTERNAL://kafka:9094,
        EXTERNAL://${KAFKA_EXTERNAL_HOST}:9095
      KAFKA_CLIENT_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - base_stack_net

  kafka-ui:
    image: kafbat/kafka-ui:f51df4c
    container_name: base_stack_kafka_ui
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9094"
    networks:
      - base_stack_net
    depends_on: [ kafka ]

  # ======================
  # Debezium
  # ======================
  debezium:
    image: debezium/connect:3.0.0.Final
    container_name: base_stack_debezium
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9094
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: "debezium__connect_configs"
      OFFSET_STORAGE_TOPIC: "debezium__connect_offsets"
      STATUS_STORAGE_TOPIC: "debezium__connect_statuses"
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      ENABLE_DEBEZIUM_SCRIPTING: "true"
    networks:
      - base_stack_net
    depends_on: [ kafka, postgres ]

  # ======================
  # Minio
  # ======================
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: base_stack_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: secret123
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - base_stack_net

  # ======================
  # MailDev
  # ======================
  maildev:
    image: maildev/maildev:2.2.1
    container_name: base_stack_maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - base_stack_net
